services:
  - type: web
    name: browser-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: AGENT_BASE_URL
        sync: false
      - key: AGENT_MODEL
        value: agnes-2.5-pro
